title: Disclose Forms Text Recovery Add-on
description: >
  Recovers text typed into filled PDF form fields.
type: object
documents:
  - selected
  - query
properties:
  dry_run:
    title: Dry run?
    type: boolean
    default: false
    description: "If selected, no page text is changed and no metadata is set. The full analysis still runs and a report of exactly what would have changed, with a before/after diff per page, is attached to this run for download. Run this first."
  to_tag:
    title: Tag processed documents?
    type: boolean
    default: true
    description: "Adds forms_text_recovery_addon:v1 to each document once its pages are updated. Keep this on: it is what lets an interrupted run be resumed, by excluding already-processed documents from the search that feeds this Add-On."
  max_documents:
    title: Maximum documents this run
    type: integer
    default: 0
    description: "Stops after this many documents"
categories:
  - extraction
