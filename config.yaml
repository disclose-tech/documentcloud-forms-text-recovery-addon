title: Disclose Forms Text Recovery Add-on
description: >
  Recovers text typed into filled PDF form fields.
type: object
documents:
  - selected
  - query
properties:
  dry_run:
    title: Dry run?
    type: boolean
    default: false
    description: "If selected, no page text is changed and no metadata is set. A report is attached to the run for download."
  to_tag:
    title: Tag processed documents?
    type: boolean
    default: true
    description: "Adds forms_text_recovery_addon:v1 to each document once its pages are updated."
  max_documents:
    title: Maximum documents this run
    type: integer
    default: 0
    description: "Stops after this many documents"
categories:
  - extraction
